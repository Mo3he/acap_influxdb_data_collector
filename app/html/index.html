<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfluxDB Data Collector</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>InfluxDB Data Collector</h1>
    </header>

    <main>
        <section class="card">
            <h2>InfluxDB Connection</h2>
            <div class="form-group">
                <label for="influxdbUrl">URL</label>
                <input type="text" id="influxdbUrl" placeholder="http://192.168.1.100:8086">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="influxdbOrg">Organisation</label>
                    <input type="text" id="influxdbOrg" placeholder="my-org">
                </div>
                <div class="form-group">
                    <label for="influxdbBucket">Bucket</label>
                    <input type="text" id="influxdbBucket" placeholder="my-bucket">
                </div>
            </div>
            <div class="form-group">
                <label for="influxdbToken">API Token</label>
                <input type="password" id="influxdbToken" placeholder="your-api-token">
            </div>
            <div class="form-group">
                <label for="pollInterval">Poll Interval (seconds)</label>
                <input type="number" id="pollInterval" min="10" max="3600" value="30">
            </div>
            <div class="toggle-row">
                <span>Enable data collection</span>
                <label class="toggle">
                    <input type="checkbox" id="influxdbEnabled">
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <section class="card">
            <h2>Data Types</h2>

            <p class="group-label">System Metrics</p>
            <div class="checkbox-grid">
                <label class="check-item">
                    <input type="checkbox" name="cpu">
                    <span>CPU Usage</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" name="memory">
                    <span>Memory Usage</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" name="network">
                    <span>Network</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" name="temperature">
                    <span>CPU Temperature</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" name="uptime">
                    <span>Uptime</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" name="storage">
                    <span>SD Card Usage</span>
                </label>
            </div>

            <p class="group-label">Thermometry</p>
            <div class="checkbox-grid">
                <label class="check-item">
                    <input type="checkbox" name="thermometry">
                    <span>Thermal Zone Temps</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" name="spot_temperature">
                    <span>Spot Temperature</span>
                </label>
            </div>

            <p class="group-label">Air Quality — AXIS D6310</p>
            <div class="checkbox-grid">
                <label class="check-item">
                    <input type="checkbox" name="air_quality">
                    <span>Air Quality Metrics</span>
                </label>
            </div>
        </section>

        <div class="actions">
            <button id="saveBtn" class="btn primary">Save</button>
            <button id="testBtn" class="btn secondary">Test Connection</button>
        </div>

        <div id="toast" class="toast"></div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
